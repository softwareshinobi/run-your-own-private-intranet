services:

##########################################
##
## public / network infrastructure
##
##########################################

    public-vpn-server:

        container_name: public-vpn-server
        
        image: kylemanna/openvpn

        restart: unless-stopped
                
        cap_add:

            - NET_ADMIN       

        volumes:

            - /volumes/intranet/openvpn:/etc/openvpn

        ports:

            - "1194:1194/udp"

    public-vpn-docs:

        container_name: public-vpn-docs

        image: softwareshinobi/embanet-intranet-docs

        build: 

            context: docs

            dockerfile: Dockerfile
      
        restart: unless-stopped
  
        ports:

            - "1180:80"

##########################################
##
## private / identity & access managment
##
##########################################

    public-vpn-proxy:

        container_name: public-vpn-proxy

        image: softwareshinobi/basic-container-auth-proxy

        restart: unless-stopped

        ports:

            - 1194:80

        environment:
            
##            BASIC_AUTH_USERNAME: shinobi
##
##            BASIC_AUTH_PASSWORD: password

            PROXY_PASS: http://private-vpn-keys/

    private-vpn-keys:

        container_name: private-vpn-keys
        
        image: softwareshinobi/embanet-intranet-keys

        restart: unless-stopped

        build: 

            context: publisher

            dockerfile: Dockerfile
      
        volumes:

            - /volumes/intranet/openvpn/:/usr/share/nginx/html/keys/

        ports:

            - "127.0.0.1:1188:80"
            
            - "10.28.1.1:1188:80"

##########################################
##
## intranet / landing
##
##########################################

    private-intranet-landing:

        container_name: private-intranet-landing

        image: softwareshinobi/embanet-intranet-landing

        build: 

            context: landing

            dockerfile: Dockerfile
 
        restart: unless-stopped
  
        ports:

            - "127.0.0.1:80:80"
            
            - "10.28.1.1:80:80"

##
##
##

    intranet-calendar:

        container_name: intranet-calendar

        image: tomsquest/docker-radicale

        restart: unless-stopped

        ports:

            - "10.28.1.1:5232:5232"           

        volumes:

            - /volumes/intranet/calendar:/data

##########################################
##
## intranet / file storage
##
##########################################
    
    intranet-nfs:

        container_name: intranet-nfs

        image: itsthenetwork/nfs-server-alpine:12

        privileged: true
        
        restart: unless-stopped

        volumes:

            - /volumes/intranet/media:/media

        ports:

            - "10.28.1.1:2049:2049"

        environment:

            - SHARED_DIRECTORY=/media

##########################################
##
## intranet / relational data
##
##########################################

    intranet-database:

        container_name: intranet-database

        image: mariadb

        volumes:

            - /volumes/intranet/database:/var/lib/mysql

        ports:

              - "10.28.1.1:3306:3306"

        environment:

            MYSQL_ROOT_PASSWORD: aggiepride

            MYSQL_DATABASE: intranet

            MYSQL_USER: intranet

            MYSQL_PASSWORD: intranet

    intranet-phpmyadmin:

        container_name: intranet-phpmyadmin

        image: beeyev/phpmyadmin-lightweight

        depends_on:

           - intranet-database

        links:

           - intranet-database

        ports:

            - "10.28.1.1:3380:80"

        environment:

            PMA_HOST: intranet-database

##########################################
##
## intranet / blogging
##
##########################################

    intranet-wordpress:

        container_name: intranet-wordpress

        image: wordpress:latest

        depends_on:

            - intranet-database

        restart: unless-stopped
    
        volumes:
                          
            - /volumes/intranet/wordpress:/var/www/html
        
        ports:
        
            - "10.28.1.1:8080:80"        
        
        environment:

            WORDPRESS_DB_HOST: intranet-database

            WORDPRESS_DB_USER: intranet

            WORDPRESS_DB_PASSWORD: intranet

            WORDPRESS_DB_NAME: intranet

##########################################
##
## intranet / developer ops
##
##########################################

    intranet-source-code:

        container_name: intranet-source-code

        image: gitea/gitea:latest

        restart: unless-stopped

        volumes:

            - /volumes/intranet/gitea:/data

            - /etc/timezone:/etc/timezone:ro

            - /etc/localtime:/etc/localtime:ro

        ports:

            - "10.28.1.1:3000:3000"

            - "10.28.1.1:3022:22"

        environment:

            USER_UID: 1000

            USER_GID: 1000

##########################################
##
## intranet / private desktop
##
##########################################

    intranet-ubuntu:

        container_name: intranet-ubuntu

        image: softwareshinobi/software-shinobi-linux

        volumes:

            - /volumes/intranet/servers/countach/shinobi:/home/shinobi

            - /volumes/intranet/servers/share:/home/shinobi/Share
 
        hostname: countach

        domainname: countach.embanet.online

        ports:
            
            - "10.28.1.1:2222:22"

    intranet-desktop:

        container_name: intranet-desktop

        hostname: urus

        image: softwareshinobi/shinobi-academy-desktop

        restart: unless-stopped

##        deploy:
##
##            resources:
##
##                limits:
##          - "10.28.1.1:5900:5900"

##                    cpus: 2
##
##                    memory: 3.5G
##
##                reservations:
##
##                    cpus: 1
##
##                    memory: 2.0G

        volumes:

            - /volumes/intranet/servers/shinobi:/home/shinobi
            
            - /volumes/intranet/servers/share:/home/shinobi/Share           

        ports:

          - "10.28.1.1:5922:22"
          
          - "10.28.1.1:5980:80"

          - "10.28.1.1:5900:5900"

          - "127.0.0.1:5900:5900"
          
        domainname: urus.embanet.online

        environment:
        
            TZ: America/Bogota

            USER_UID: 1000

            USER_GID: 1000

            USER: shinobi

            PASSWORD: password

            HTTP_PASSWORD: password


##

    intranet-automation:

        container_name: intranet-automation

        image: jenkins/jenkins:lts

        privileged: true

        user: root

        ports:

            - "10.28.1.1:9999:8080"

            - "10.28.1.1:50000:50000"

        volumes:

            - /volumes/intranet/devops/jenkins/:/var/jenkins_home

            - /var/run/docker.sock:/var/run/docker.sock
      
